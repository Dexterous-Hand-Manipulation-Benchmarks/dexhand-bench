name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [flashsac, fasttd3, reppo, ppo]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # top-level only; Genesis' own submodules are not needed
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --exact --extra ${{ matrix.extra }}
      - run: uv run --exact --extra ${{ matrix.extra }} pytest -m "not sim" -v
      # Type check our code; it needs the full flashsac install. Non-blocking until the cleanup is done.
      - if: matrix.extra == 'flashsac'
        continue-on-error: true
        run: uv run --exact --extra flashsac basedpyright

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # until the cleanup is done
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init algorithms/FlashSAC
      - uses: astral-sh/setup-uv@v10.3.3
      # --frozen: --locked would read every path dependency's metadata, and only FlashSAC is checked out here.
      - run: uv run --frozen --only-dev ruff check
      # FlashSAC files that are entirely ours get the umbrella rules; the rest of the fork keeps its upstream config.
      - if: ${{ !cancelled() }}
        run: >-
          uv run --frozen --only-dev ruff check --config pyproject.toml
          algorithms/FlashSAC/eval_dexmachina.py
          algorithms/FlashSAC/check_curriculum.py
          algorithms/FlashSAC/flash_rl/envs/dexmachina.py
      - if: ${{ !cancelled() }}
        run: uv run --frozen --only-dev ruff check --extend-exclude play_isaaclab.py algorithms/FlashSAC
