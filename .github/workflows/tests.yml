name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [flashsac, fasttd3, reppo, ppo, dexhand-ppo]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # top-level only; Genesis' own submodules are not needed
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --exact --extra ${{ matrix.extra }}
      - run: uv run --exact --extra ${{ matrix.extra }} pytest -m "not sim" -v
      # Golden rollouts were recorded on macOS arm64; on this runner they check the platform-independent parts.
      - if: matrix.extra == 'flashsac' || matrix.extra == 'fasttd3'
        run: uv run --exact --extra ${{ matrix.extra }} pytest -m sim -v
      # dexhand-ppo: 2-env CPU smoke test on the real simulator, and the fork's own core tests (GAE, normalisers,
      # configs; its Pendulum tests need gymnasium, which the umbrella extra does not install, and are skipped).
      - if: matrix.extra == 'dexhand-ppo'
        run: uv run --exact --extra dexhand-ppo pytest -m sim -v
      - if: matrix.extra == 'dexhand-ppo'
        run: uv run --exact --extra dexhand-ppo pytest algorithms/dexhand-ppo/tests -v
      # Type check our code; it needs the full flashsac install. Non-blocking until ruff and basedpyright are clean.
      - if: matrix.extra == 'flashsac'
        continue-on-error: true
        run: uv run --exact --extra flashsac basedpyright

  # Separate from lint: these rules block, the rest of lint does not yet.
  silent-failures:
    runs-on: ubuntu-latest
    env:
      SILENT_FAILURE_RULES: BLE001,S110,S112,E722
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init algorithms/FlashSAC environments/dexmachina
      - uses: astral-sh/setup-uv@v10.3.3
      - run: >-
          uv run --frozen --only-dev ruff check --config pyproject.toml --select $SILENT_FAILURE_RULES
          src scripts tests
          algorithms/FlashSAC/eval_dexmachina.py
          algorithms/FlashSAC/check_curriculum.py
          algorithms/FlashSAC/flash_rl/envs/dexmachina.py
      - run: uv run --frozen --only-dev ruff check --isolated --select $SILENT_FAILURE_RULES environments/dexmachina

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # until ruff and basedpyright are clean
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init algorithms/FlashSAC
      - uses: astral-sh/setup-uv@v10.3.3
      # --frozen: --locked would read every path dependency's metadata, and only FlashSAC is checked out here.
      - run: uv run --frozen --only-dev ruff check
      # FlashSAC files that are entirely ours get the umbrella rules; the rest of the fork keeps its upstream config.
      - if: ${{ !cancelled() }}
        run: >-
          uv run --frozen --only-dev ruff check --config pyproject.toml
          algorithms/FlashSAC/eval_dexmachina.py
          algorithms/FlashSAC/check_curriculum.py
          algorithms/FlashSAC/flash_rl/envs/dexmachina.py
      - if: ${{ !cancelled() }}
        run: uv run --frozen --only-dev ruff check --extend-exclude play_isaaclab.py algorithms/FlashSAC
