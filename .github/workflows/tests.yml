name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [flashsac, fasttd3, reppo, ppo]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # top-level only; Genesis' own submodules are not needed
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --exact --extra ${{ matrix.extra }}
      - run: uv run --exact --extra ${{ matrix.extra }} pytest -m "not sim" -v
