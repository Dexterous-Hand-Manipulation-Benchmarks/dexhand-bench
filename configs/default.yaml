# Shared defaults. Do not put personal settings here: copy local.example.yaml
# to local.yaml (git-ignored) and override what you need there.

wandb:
  entity: null             # W&B team/user; null = your W&B default entity
  project: dexmachina_clean

slurm:
  # Passed to sbatch as command-line flags (they override #SBATCH lines).
  partition: null
  account: null
  gres: gpu:1
  cpus_per_task: 16
  extra_args: []           # any further sbatch flags, e.g. ["--mail-type=END"]
  jobs:                    # per-job overrides of the keys above (+ time)
    reppo:
      time: "16:00:00"
    ppo:
      time: "00:30:00"
